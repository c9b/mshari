<!DOCTYPE html>
<html>
<head>
    <title>تطبيق المحادثة</title>
    <style>
        body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #loginForm { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        #chatContainer { display: none; }
        #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
        #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
        #input:focus { outline: none; }
        #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }
        #messages { list-style-type: none; margin: 0; padding: 0; margin-bottom: 3rem; }
        #messages > li { padding: 0.5rem 1rem; }
        #messages > li:nth-child(odd) { background: #efefef; }
        #userList { position: fixed; right: 0; top: 0; width: 200px; background: #f8f8f8; height: 100%; padding: 1rem; box-sizing: border-box; }
        #userList h3 { margin-top: 0; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="loginForm">
        <h2>أدخل اسمك</h2>
        <input type="text" id="username" placeholder="اسم المستخدم" />
        <button onclick="login()">دخول</button>
        <div id="loginError" class="error"></div>
    </div>

    <div id="chatContainer">
        <div id="userList">
            <h3>المستخدمين المتصلين</h3>
            <ul id="users"></ul>
        </div>
        <ul id="messages"></ul>
        <form id="form" action="">
            <input id="input" autocomplete="off" /><button>إرسال</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const loginForm = document.getElementById('loginForm');
        const chatContainer = document.getElementById('chatContainer');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const usersList = document.getElementById('users');

        function login() {
            const username = document.getElementById('username').value.trim();
            if (username) {
                socket.emit('new user', username);
            }
        }

        socket.on('login success', (username) => {
            loginForm.style.display = 'none';
            chatContainer.style.display = 'block';
            document.getElementById('loginError').textContent = '';
        });

        socket.on('login failed', (message) => {
            document.getElementById('loginError').textContent = message;
        });

        socket.on('user list', (users) => {
            usersList.innerHTML = '';
            users.forEach(user => {
                const li = document.createElement('li');
                li.textContent = user;
                usersList.appendChild(li);
            });
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

        socket.on('chat message', (msg) => {
            const item = document.createElement('li');
            item.textContent = msg;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
        });
    </script>
</body>
</html>
