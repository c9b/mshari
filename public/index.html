<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة شخصية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
        }

        .animated-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f2937, #0a0a0a, #2c3e50, #1f2937);
            background-size: 400% 400%;
            animation: elegant-shift 30s ease-in-out infinite;
            z-index: 0;
        }
        
        .animated-background::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(124, 58, 237, 0.6) 2px, transparent 2px),
                radial-gradient(circle at 85% 20%, rgba(124, 58, 237, 0.6) 2px, transparent 2px),
                radial-gradient(circle at 45% 80%, rgba(124, 58, 237, 0.6) 2px, transparent 2px),
                radial-gradient(circle at 75% 65%, rgba(124, 58, 237, 0.6) 2px, transparent 2px),
                radial-gradient(circle at 25% 30%, rgba(124, 58, 237, 0.6) 2px, transparent 2px),
                radial-gradient(circle at 60% 10%, rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                radial-gradient(circle at 30% 70%, rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                radial-gradient(circle at 90% 40%, rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                radial-gradient(circle at 5% 90%, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                radial-gradient(circle at 95% 55%, rgba(124, 58, 237, 0.3) 1px, transparent 1px),
                radial-gradient(circle at 40% 5%, rgba(255, 255, 255, 0.5) 2px, transparent 2px),
                radial-gradient(circle at 70% 90%, rgba(124, 58, 237, 0.4) 2px, transparent 2px),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.3) 1px, transparent 1px),
                radial-gradient(circle at 10% 80%, rgba(255, 255, 255, 0.5) 1px, transparent 1px),
                radial-gradient(circle at 80% 10%, rgba(124, 58, 237, 0.4) 2px, transparent 2px),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.6) 2px, transparent 2px),
                radial-gradient(circle at 30% 20%, rgba(124, 58, 237, 0.5) 2px, transparent 2px),
                radial-gradient(circle at 70% 40%, rgba(255, 255, 255, 0.3) 1px, transparent 1px),
                radial-gradient(circle at 12% 65%, rgba(255, 255, 255, 0.5) 1.5px, transparent 1.5px),
                radial-gradient(circle at 90% 70%, rgba(124, 58, 237, 0.6) 2px, transparent 2px),
                radial-gradient(circle at 40% 30%, rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                radial-gradient(circle at 65% 55%, rgba(124, 58, 237, 0.5) 1.5px, transparent 1.5px),
                radial-gradient(circle at 20% 40%, rgba(255, 255, 255, 0.3) 1px, transparent 1px),
                radial-gradient(circle at 88% 5%, rgba(124, 58, 237, 0.6) 2px, transparent 2px);
            background-size: 300% 300%;
            opacity: 0.8;
            animation: particles-move 60s linear infinite;
        }
        
        @keyframes elegant-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes particles-move {
            0% { background-position: 0 0; }
            100% { background-position: 300% 300%; }
        }

        .profile-card {
            position: relative;
            z-index: 10;
            background: rgba(27, 30, 40, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
        }

        .profile-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(124, 58, 237, 0.8);
        }

        .social-link:hover svg {
            transform: scale(1.2);
            filter: drop-shadow(0 0 5px rgba(124, 58, 237, 0.8));
        }
    </style>
</head>
<body class="text-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Animated Background -->
    <div class="animated-background"></div>

    <!-- Card Container -->
    <div class="profile-card rounded-2xl p-8 max-w-sm w-full text-center">
        
        <!-- Profile Section -->
        <div class="flex flex-col items-center">
            <!-- Profile Name and Title -->
            <h1 class="text-3xl font-bold mt-4 text-white">مشاري</h1>
            <p class="text-md text-gray-400 mt-2">مبرمج بسيط ..</p>

            <!-- Bio -->
            <p class="text-sm mt-6 leading-relaxed text-gray-300">
                HTML PHP NODE.JS LARAVEL VUE.JS REACT NATIVE PYTHON DJANGO FLUTTER
            </p>
        </div>

        <!-- Social Links Section -->
        <div class="mt-8 pt-6 border-t border-gray-600">
            <div class="flex justify-center items-center mt-4 space-x-4 space-x-reverse">
                <!-- Twitter Link -->
                <a href="https://X.com/MHskni" target="_blank" class="social-link text-gray-400 hover:text-blue-400 transition-transform duration-300">
                    <svg class="w-8 h-8 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.261 8.502 11.239h-6.69l-5.88-7.795-6.736 7.795H2.25l8.525-9.743L2.25 2.25h6.69l5.228 6.94L18.244 2.25zm-3.83 14.646l2.317 2.923h1.378l-2.716-3.468-1.503-1.898zM5.594 3.993l1.838 2.33h-1.373L3.914 3.993z"></path></svg>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
